<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pentique Store</title>
    <style>
      /* The light page colour the animated aurora (src/components/AuroraBackground.vue) glows over. Only on html:
         a body with its own background would paint over the aurora, which sits behind the page (z-index -1). */
      html {
        background-color: #f6f2f7;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
      }

      /* Without WebGL: a still version of the aurora, its two ribbons as soft washes of the same colours
         (yellow, pink and blue from left to right) */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(60% 20% at 18% 34%, rgb(254 203 65 / 0.42), transparent 70%),
          radial-gradient(60% 22% at 55% 32%, rgb(250 161 201 / 0.45), transparent 70%),
          radial-gradient(55% 20% at 88% 38%, rgb(120 163 201 / 0.4), transparent 70%),
          radial-gradient(60% 16% at 35% 70%, rgb(250 161 201 / 0.3), transparent 70%),
          radial-gradient(60% 16% at 80% 72%, rgb(120 163 201 / 0.32), transparent 70%);
      }

      html.has-webgl-bg body::before {
        display: none;
      }
    </style>
  </head>
  <body class="overflow-y-scroll p-6 font-sans">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
