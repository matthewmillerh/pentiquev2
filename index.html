<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pentique Store</title>
    <style>
      /* Background styles that work on all devices */
      body {
        background-image: url('/background.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
      }

      /* Mobile-specific background fix for iOS */
      @media screen and (max-width: 768px) {
        body {
          background-attachment: scroll;
          background-image: none; /* Remove background on mobile to prevent conflicts */
          min-height: 100vh;
          min-height: 100dvh; /* Use dynamic viewport height for better mobile support */
        }

        body::before {
          content: '';
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          width: 100vw;
          height: 100vh;
          height: 100dvh; /* Use dynamic viewport height */
          background-image: url('/background.jpg');
          background-size: cover;
          background-position: center center;
          background-repeat: no-repeat;
          background-attachment: scroll;
          z-index: -1;
          transform: translateZ(0); /* Force hardware acceleration */
          will-change: transform; /* Optimize for animations */
        }
      }
    </style>
  </head>
  <body class="overflow-y-scroll p-6 font-sans">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
